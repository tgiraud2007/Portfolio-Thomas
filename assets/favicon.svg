<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Thomas Giraud — favicon "terminal monogram" (SISR / sysadmin theme) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b5def"/>
      <stop offset="1" stop-color="#e25327"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Terminal window bar -->
  <rect x="12" y="14" width="40" height="36" rx="4" fill="#0a0b0d"/>
  <circle cx="18" cy="20" r="1.8" fill="#ff5f57"/>
  <circle cx="24" cy="20" r="1.8" fill="#ffbd2e"/>
  <circle cx="30" cy="20" r="1.8" fill="#15803d"/>

  <!-- Prompt + monogram "tg" -->
  <text x="14" y="42" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="17" font-weight="700" fill="#f4f4f4">&gt;tg</text>
  <!-- Blinking caret -->
  <rect x="40" y="32" width="6" height="12" fill="#e25327"/>
</svg>
