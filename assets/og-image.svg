<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Thomas Giraud — Open Graph image (1200x630) -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0d"/>
      <stop offset="0.55" stop-color="#111215"/>
      <stop offset="1" stop-color="#1b1d22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b5def"/>
      <stop offset="1" stop-color="#e25327"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Terminal-ish prompt -->
  <text x="80" y="150" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="28" fill="#e25327" letter-spacing="2">// thomasgiraud.me</text>

  <!-- Main name -->
  <text x="78" y="300" font-family="Arial,Helvetica,sans-serif"
        font-size="96" font-weight="900" fill="#f4f4f4">Thomas Giraud</text>

  <!-- Role -->
  <text x="82" y="370" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="36" fill="#4a7ff7" font-weight="600">BTS SIO (SISR)</text>
  <text x="82" y="418" font-family="'JetBrains Mono','Courier New',monospace"
        font-size="28" fill="#a9b2c3">Administration Systèmes &amp; Réseaux</text>

  <!-- Tags -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="22" font-weight="700">
    <rect x="82" y="470" width="200" height="44" rx="6" fill="#1b5def" fill-opacity="0.15" stroke="#1b5def" stroke-opacity="0.4"/>
    <text x="182" y="499" fill="#4a7ff7" text-anchor="middle">Active Directory</text>

    <rect x="296" y="470" width="120" height="44" rx="6" fill="#e25327" fill-opacity="0.15" stroke="#e25327" stroke-opacity="0.4"/>
    <text x="356" y="499" fill="#e8734b" text-anchor="middle">IPFire</text>

    <rect x="430" y="470" width="120" height="44" rx="6" fill="#1b5def" fill-opacity="0.15" stroke="#1b5def" stroke-opacity="0.4"/>
    <text x="490" y="499" fill="#4a7ff7" text-anchor="middle">Cisco IOS</text>

    <rect x="564" y="470" width="160" height="44" rx="6" fill="#15803d" fill-opacity="0.15" stroke="#15803d" stroke-opacity="0.4"/>
    <text x="644" y="499" fill="#2ecc71" text-anchor="middle">Virtualisation</text>
  </g>

  <!-- Status bar mock -->
  <rect x="0" y="594" width="1200" height="36" fill="#0a0b0d"/>
  <circle cx="40" cy="612" r="5" fill="#2ecc71"/>
  <text x="58" y="619" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" fill="#7a8290">ad_online · cisco_up · system.ready</text>
  <text x="1140" y="619" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" fill="#7a8290" text-anchor="end">tg</text>
</svg>
